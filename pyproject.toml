[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "QLA"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["S101"]
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_qualia_code.plugin"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = true

# Exclude directories that shouldn't be type-checked
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "htmlcov",
    "htmlcov_backend",
    ".coverage"
]

# NOTE: QUALIA.CODE enforcement is handled by the mypy_qualia_code plugin loaded above
# No additional mypy settings are needed here as the plugin integrates automatically

[[tool.mypy.overrides]]
module = [
    "mypy_qualia_code.*",
    "ruff_qualia_code.*",
    "eslint-plugin-qualia-code.*"
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Relax rules for test files
[[tool.mypy.overrides]]
module = "qualia_tempo_prototype.backend.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
warn_no_return = false

# Alternative: per-file pattern for tests
[[tool.mypy.overrides]]
module = "*.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
warn_no_return = false

# Note: The above patterns cover all test files. MyPy requires fully-qualified module names
# with optional wildcards in components (e.g., "package.*.tests.*")
# The existing "qualia_tempo_prototype.backend.tests.*" override already covers backend tests

[[tool.mypy.overrides]]
module = "qualia_tempo_prototype.backend.engine.qualia_particle_engine"
warn_unreachable = false

[[tool.mypy.overrides]]
module = "qualia_tempo_prototype.backend.services.StreamingWebService"
warn_unreachable = false

[[tool.mypy.overrides]]
module = "qualia_tempo_prototype.backend.services.StateStreamingService"
warn_unreachable = false