[workspace]
members = ["backend","qualia_macros", "shared_core"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
mockall = "0.13"
async-trait = "0.1"
shaku = "0.6"

[workspace.lints.clippy]
# Core quality checks - DENY level
unwrap_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Allow common patterns for game development
expect_used = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
suboptimal_flops = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unused_self = "allow"
result_large_err = "allow"
significant_drop_tightening = "allow"
too_many_arguments = "warn"
cognitive_complexity = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
