[workspace]
members = ["qualia_macros", "shared_core", "backend", "frontend"]
resolver = "2"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Dependency injection
shaku = "0.6"
async-trait = "0.1"

# Testing
mockall = "0.12"

# Utilities
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.clippy]
# Lint groups with lower priority to allow specific overrides
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Critical safety rules (deny) - these override groups
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Performance rules
clone_on_copy = "deny"

# Complexity limits
cognitive_complexity = { level = "warn", priority = 1 }

# Allow certain patterns
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
