# QUALIA TEMPO RUST REWRITE - ROOT WORKSPACE MANIFEST
# VERSION: 1.0
# COMPLIANCE: QUALIA.CODE.RUST v1.1 + ARCHITECTURE.RUST v2.0

[workspace]
members = [
    "shared_core",
    "backend",
    "frontend",
    "qualia_macros",
]
resolver = "2"

[workspace.dependencies]
# === Async Runtime ===
tokio = { version = "1.41", features = ["full"] }

# === Serialization ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# === Logging & Tracing ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# === Error Handling ===
anyhow = "1.0"
thiserror = "1.0"

# === Dependency Injection ===
shaku = "0.6"
async-trait = "0.1"

# === Testing & Mocking ===
mockall = "0.12"
proptest = "1.0"

# === JSON Schema Generation ===
schemars = "1.0"

# === Validation ===
validator = { version = "0.16", features = ["derive"] }

# === Utilities ===
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

# === Procedural Macros ===
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

# === Caching ===
cached = "0.46"

# === Async Channels ===
async-channel = "2.1"

# === Lazy Static / Once Cell ===
once_cell = "1.19"

# === Performance ===
rayon = "1.8"

# === Web (Backend) ===
axum = { version = "0.7", features = ["ws", "macros"] }
tokio-tungstenite = "0.21"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# === Web (Frontend) ===
leptos = { version = "0.5", features = ["csr"] }
wgpu = "22.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioNode",
    "GainNode",
    "OscillatorNode",
    "AnalyserNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
] }

# === Math ===
glam = "0.25"

[workspace.lints.clippy]
# === Pedantic Rules (DENY) ===
pedantic = "deny"
nursery = "deny"
style = "deny"
perf = "deny"
complexity = "deny"
cargo = "deny"

# === Critical Safety Rules (DENY) ===
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# === Type Safety Rules (DENY) ===
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# === Complexity Rules (DENY) ===
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"

# === Documentation Rules (DENY) ===
missing_errors_doc = "deny"
missing_panics_doc = "deny"

# === Performance Rules (DENY) ===
significant_drop_in_scrutinee = "deny"
clone_on_copy = "deny"

# === Allowed Exceptions (Justified) ===
must_use_candidate = "allow"              # Too aggressive for our use case
module_name_repetitions = "allow"         # Acceptable for organization
missing_docs_in_private_items = "allow"   # Private items can omit docs

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

# Profile-Guided Optimization (PGO) support
[profile.pgo]
inherits = "release"
lto = "fat"
codegen-units = 1
