# Cargo Configuration for Qualia Tempo Rust Rewrite
# Optimized for development and production builds

[build]
# Use all available CPU cores
jobs = -1

[target.x86_64-unknown-linux-gnu]
# Linux-specific optimizations
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-pc-windows-msvc]
# Windows-specific optimizations
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-apple-darwin]
# macOS-specific optimizations
rustflags = ["-C", "target-cpu=native"]

[target.wasm32-unknown-unknown]
# WASM-specific optimizations
rustflags = ["-C", "opt-level=z", "-C", "lto=fat"]

[alias]
# Convenience aliases
xtask = "run --package xtask --"
test-all = "test --workspace --all-features"
clippy-all = "clippy --workspace --all-features --all-targets -- -D warnings"
build-release = "build --release --workspace"
