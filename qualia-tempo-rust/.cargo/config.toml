# .cargo/config.toml - Cargo Build Configuration
# COMPLIANCE: QUALIA.CODE.RUST v1.1 - Performance Optimization

[build]
# Use all available CPU cores for parallel compilation (default behavior)
# jobs = 0 is not valid, cargo will use all cores by default

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# Profile-Guided Optimization settings
[profile.pgo-generate]
# Profile data will be written to target/pgo-profiles/

[profile.pgo-use]
# Profile data will be read from target/pgo-profiles/
