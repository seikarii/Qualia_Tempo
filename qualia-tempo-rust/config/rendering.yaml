# Rendering Service Configuration
# Qualia Tempo - Rust Version

# WebGPU Settings
webgpu:
  backend: "webgl"  # "webgl" or "webgpu" (fallback to webgl)
  power_preference: "high-performance"  # "low-power" or "high-performance"
  present_mode: "fifo"  # "fifo" (VSync) or "mailbox" (no VSync)

# Deferred Rendering Pipeline
deferred_rendering:
  g_buffer:
    width: 1920
    height: 1080
    formats:
      albedo: "rgba8unorm"
      normal: "rgba16float"
      depth: "depth24plus"

  lighting:
    ambient_color: [0.1, 0.1, 0.15]
    ambient_intensity: 0.3
    max_lights: 16

  post_processing:
    enabled: true
    passes:
      - bloom
      - depth_of_field
      - motion_blur
      - temporal_anti_aliasing
      - color_grading

# SDF Rendering
sdf:
  player_avatar:
    capsule:
      radius: 0.5
      height: 2.0
    mandelbulb:
      iterations: 8
      power: 8.0
      bailout: 2.0
    morph_transition_duration_ms: 500

  boss_avatar:
    julia_set:
      iterations: 16
      c_quaternion: [0.3, 0.5, 0.4, 0.2]
      bailout: 4.0
    scale: 3.0

  raymarching:
    max_steps: 128
    epsilon: 0.001
    max_distance: 100.0

# Particle System
particles:
  max_particles: 5000
  compute_shader:
    workgroup_size: [16, 16, 1]
    dispatch_per_frame: true
  
  emission:
    rate_per_second: 500
    burst_count: 100
    burst_interval_ms: 200

  physics:
    gravity: [0.0, -9.8, 0.0]
    drag_coefficient: 0.98
    velocity_range: [1.0, 5.0]

# Bloom Post-Processing
bloom:
  enabled: true
  threshold: 0.8
  intensity: 0.5
  blur_iterations: 5

# Depth of Field
depth_of_field:
  enabled: true
  focus_distance: 10.0
  aperture: 0.05
  max_blur: 5.0

# Motion Blur
motion_blur:
  enabled: true
  samples: 8
  shutter_speed: 0.5

# Temporal Anti-Aliasing (TAA)
temporal_anti_aliasing:
  enabled: true
  jitter_scale: 1.0
  history_blend_factor: 0.9

# Reaction-Diffusion Field
reaction_diffusion:
  grid_size: [512, 512]
  diffusion_rate_a: 1.0
  diffusion_rate_b: 0.5
  feed_rate: 0.055
  kill_rate: 0.062
  time_step: 1.0
  iterations_per_frame: 10

# Performance Settings
performance:
  target_fps: 60
  vsync: true
  dynamic_resolution: false
  resolution_scale_range: [0.5, 1.0]
