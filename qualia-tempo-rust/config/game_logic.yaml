# Game Logic Service Configuration
# Qualia Tempo - Rust Version

# Qualia State Calculation
qualia_calculation:
  # Intensity calculation
  intensity:
    base_multiplier: 1.0
    accuracy_scaling: 2.0  # Higher accuracy = higher intensity
    decay_rate: 0.95       # Per-second decay when no input
    max_value: 1.0
    min_value: 0.0

  # Harmony calculation
  harmony:
    base_multiplier: 1.0
    consistency_window_ms: 500  # Time window for timing consistency
    decay_rate: 0.98
    max_value: 1.0
    min_value: 0.0

  # Chaos calculation
  chaos:
    base_multiplier: 1.0
    randomness_threshold: 0.3  # Variation threshold for chaos increase
    decay_rate: 0.97
    max_value: 1.0
    min_value: 0.0

  # Kairos calculation
  kairos:
    base_multiplier: 1.0
    perfect_timing_window_ms: 50  # Window for "perfect" timing
    decay_rate: 0.99
    max_value: 1.0
    min_value: 0.0

  # Transcendence calculation
  transcendence:
    base_multiplier: 0.1
    requirements:
      min_intensity: 0.8
      min_harmony: 0.7
      min_kairos: 0.9
    buildup_rate: 0.01  # Per second when requirements met
    decay_rate: 0.995
    max_value: 1.0
    min_value: 0.0

# Combat System
combat:
  player:
    max_health: 100.0
    dash_cooldown_ms: 1000
    dash_duration_ms: 200
    invulnerability_frames: 10

  boss:
    max_health: 1000.0
    phases:
      - name: "Awakening"
        health_threshold: 1.0
        attack_speed_multiplier: 1.0
      - name: "Escalation"
        health_threshold: 0.75
        attack_speed_multiplier: 1.2
      - name: "Chaos"
        health_threshold: 0.5
        attack_speed_multiplier: 1.5
      - name: "Finale"
        health_threshold: 0.25
        attack_speed_multiplier: 2.0

# Scoring System
scoring:
  base_score_per_action: 100
  accuracy_multiplier: 2.0    # Max bonus for perfect accuracy
  combo_multiplier_per_hit: 0.1  # +10% per combo hit
  max_combo_multiplier: 5.0   # Max 5x multiplier at 40 combo
  combo_break_time_ms: 2000   # Combo resets after 2s without input

# Pattern Recognition
patterns:
  min_actions_for_pattern: 3
  pattern_timeout_ms: 5000
  difficulty_scaling:
    easy: 1.0
    medium: 1.5
    hard: 2.0
    insane: 3.0
