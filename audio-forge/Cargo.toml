[package]
name = "audio-forge"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
biquad = "0.4.2"
dirs = "5.0"
eframe = { version = "0.33.0", features = ["glow", "wayland", "x11"], default-features = false }
egui = "0.33.0"
hound = "3.5.1"
rfd = "0.15"
ringbuf = "0.4.2"
rodio = { version = "0.21.1", features = ["symphonia-all"] }
rustfft = { version = "6.4.1", features = ["avx"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
shaku = "0.6.2"
spectrum-analyzer = "1.7.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
mockall = "0.13.1"
proptest = "1.6.0"
tempfile = "3.10"

[[bench]]
name = "fft_pipeline"
harness = false

[[bench]]
name = "memory_usage"
harness = false

# Optimización balanceada de compilación
[profile.dev]
opt-level = 0              # Sin optimización para build rápido
incremental = true
codegen-units = 16         # Paralelismo razonable (standard: 16-32)
debug = 0                  # Sin debug info

[profile.dev.package."*"]
opt-level = 3              # Solo optimizar dependencias
codegen-units = 1

[profile.release]
opt-level = 3              # Maximum optimization
lto = "fat"                # Full LTO (better than thin for final binary)
codegen-units = 1          # Single codegen unit for max optimization
strip = true               # Strip symbols for smaller binary
panic = "abort"            # No stack unwinding
debug = false              # No debug info in release
