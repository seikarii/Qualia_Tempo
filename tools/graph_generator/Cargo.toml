[package]
name = "graph_generator"
version = "0.1.0"
edition = "2021"
authors = ["Qualia Tempo Team"]
description = "Herramienta de análisis estático para generar mapas de grafos arquitectónicos de proyectos Rust"

[[bin]]
name = "graph_generator"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"
