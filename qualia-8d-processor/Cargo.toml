[package]
name = "qualia-8d-processor"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "qualia-8d"
path = "src/main.rs"

[lib]
name = "qualia_8d"
path = "src/lib.rs"

[dependencies]
# Audio I/O and DSP
# cpal = "0.15"  # Disabled - not needed for batch processing
dasp = "0.11"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
hound = "3.5"
rustfft = "6.2"

# HRTF - using alternative since sofar may not be available
# We'll implement SOFA loading manually if needed

# Concurrency
rayon = "1.10"
tokio = { version = "1.41", features = ["full"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.5"
approx = "0.5"
tempfile = "3.14"

[[bench]]
name = "processing_bench"
harness = false
