# QUALIA.CODE v1.1 - ErrorReporting Configuration
# All previously hardcoded values externalized
enabled: true
maxBatchSize: 50
batchFlushInterval: 30000  # 30 seconds
maxRetries: 3
retryDelay: 1000  # 1 second
rateLimitTokens: 10
rateLimitRefillRate: 1  # 1 token per second
circuitBreakerThreshold: 5
circuitBreakerTimeout: 60000  # 1 minute
enableDeduplication: true
memoryCleanupThreshold: 1000
memoryCleanupInterval: 60000  # 1 minute
rateLimitRefillInterval: 1000  # 1 second
fingerprintLength: 16  # Hash length for error deduplication
memoryCleanupRatio: 0.8  # Ratio of history to keep during cleanup

# Random ID generation settings
randomIdBase: 36  # Base for random ID generation (36 = alphanumeric)
randomIdStart: 2  # Start position for substring extraction
randomIdLength: 8  # Length of random ID suffix

# Retry processing settings
retryDelayMultiplier: 2  # Multiplier for retry processing interval

# Time conversion
millisecondsToSecondsConversion: 1000  # Convert milliseconds to seconds

# Advanced cleanup settings
oldHistoryCleanupRatio: 0.6  # Ratio of old history to keep during aggressive cleanup
duplicateRegistryMaxSize: 500  # Max size before duplicate registry cleanup
duplicateCleanupCount: 250  # Number of duplicates to remove during cleanup
completedBatchesCleanupCount: 10  # Number of completed batches to remove during cleanup

# Rate limiting (legacy compatibility)
rateLimitWindow: 60000
maxErrorsPerWindow: 100
batchSize: 50
batchTimeout: 30000
maxRetentionTime: 86400000

# External service URL (required by validator)
externalServiceUrl: "https://api.example.com/errors"

# External service configuration
externalService:
  endpoint: "https://api.example.com/errors"
  apiKey: ""
  timeout: 5000
  maxRetries: 3
  retryDelay: 2000
  batchSize: 20
  enabled: false

# Additional settings
enableCompression: true
maxBatchSizeBytes: 1048576
enableErrorFiltering: true
filterSensitiveData: true
allowedDomains:
  - "localhost"
  - "127.0.0.1"
