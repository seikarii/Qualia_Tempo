rhythmicFeedback:
  perfect:
    frequency: 800
    duration: 200
    volume: 0.8
  good:
    frequency: 600
    duration: 150
    volume: 0.6
  miss:
    frequency: 200
    duration: 300
    volume: 0.4

backgroundMusic:
  enabled: true
  volume: 0.3
  fadeInTime: 2000
  fadeOutTime: 1000

soundEffects:
  enabled: true
  masterVolume: 0.7
  spatialAudio: false

metronome:
  frequency: 440
  enabled: true
  volume: 0.5

audioEngine:
  sampleRate: 44100
  bufferSize: 256

volume: 0.7
soundEnabled: true

# Base qualia state for entity voices
baseQualiaState:
  intensity: 0.5
  precision: 0.5
  aggression: 0.0
  flow: 0.5
  chaos: 0.0
  recovery: 0.0
  transcendence: 0.0

# Thresholds for emergent audio behaviors
transcendenceThreshold: 0.8

# Default volume for audio operations
defaultVolume: 1.0

messages:
  audioContextNotAvailable: "AudioContext not available - cannot play audio"
  audioNotInitialized: "Cannot play rhythmic feedback: audio not initialized"
  cannotCreateEntityVoice: "Cannot create entity voice: audio not initialized"
  cannotRemoveEntityVoice: "Cannot remove entity voice: audio not initialized"
  cannotRemoveEntityVoices: "Cannot remove entity voices: audio not initialized"
  cannotPreloadSounds: "Cannot preload sounds: audio not initialized"
  preloadingSounds: "Preloading sounds..."
  soundsPreloaded: "Sounds preloaded successfully"

qualiaAudio:
  precision:
    frequency: 1000
    modulation: 0.2
  flow:
    frequency: 400
    modulation: 0.1
  chaos:
    frequency: 150
    modulation: 0.5
  aggression:
    frequency: 80
    modulation: 0.3
