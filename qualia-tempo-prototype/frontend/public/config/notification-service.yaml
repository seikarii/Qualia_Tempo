enabled: true
maxHistorySize: 1000
defaultTtl: 30000
enablePriorityQueuing: true
enableThrottling: true

filter:
  enabled: true
  types: []
  priorities: []
  categories: []
  sources: []
  maxAge: 30000

display:
  enableNotifications: true
  maxVisibleNotifications: 5
  notificationDuration: 3000
  enableAnimations: true
  animationDuration: 300

toasts:
  position: "top-right"
  maxVisible: 5
  duration: 3000
  animation: "slide"
  enableSound: true
  queueSize: 50
  animationDuration: 300
  fadeOutDuration: 500
  offsetX: 20
  offsetY: 20
  zIndex: 1000

styling:
  enableThemes: true
  defaultTheme: "default"
  enableCustomStyling: true
  borderRadius: 8
  shadowEnabled: true

sound:
  enableNotificationSounds: true
  defaultSoundVolume: 0.7
  enableSoundVariations: true

types:
  success:
    duration: 3000
    enableSound: true
    color: "#00ff00"
  error:
    duration: 5000
    enableSound: true
    color: "#ff0000"
  warning:
    duration: 4000
    enableSound: false
    color: "#ffff00"
  info:
    duration: 2500
    enableSound: false
    color: "#0080ff"

queue:
  enableQueueing: true
  maxQueueSize: 20
  queueProcessingInterval: 100

accessibility:
  enableScreenReader: true
  enableHighContrast: false
  enableReducedMotion: false
  enableKeyboardNavigation: true

performance:
  enablePooling: true
  maxPoolSize: 50
  enableGarbageCollection: true
  gcInterval: 60000

throttling:
  enabled: true
  maxNotificationsPerSecond: 5
  maxNotificationsPerMinute: 30
  burstLimit: 10
  cooldownPeriod: 2000
  rateLimitWindow: 1000  # 1 second
  burstWindow: 60000     # 1 minute
  historyRetention: 60000  # 1 minute

maxNotifications: 5
defaultDuration: 3000
