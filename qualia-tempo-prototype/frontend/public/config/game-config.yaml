errorPatterns:
  critical:
    - "Failed to initialize"
    - "Cannot connect to"
    - "Service unavailable"
    - "Critical error"
  high:
    - "Connection lost"
    - "Timeout"
    - "Authentication failed"
    - "Permission denied"
  medium:
    - "Retry attempt"
    - "Fallback activated"
    - "Performance warning"
    - "Validation warning"
  low:
    - "Info"
    - "Debug"
    - "Trace"
    - "Verbose"

test:
  mockServices: false
  enableDebugOutput: true
  timeoutMs: 10000
