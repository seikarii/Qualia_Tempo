# QUALIA.CODE v1.1 - DebugOrchestratorService Configuration
# Configuration for service diagnostics orchestration

refreshInterval: 5000        # Auto-refresh interval in milliseconds
maxHistoryLength: 100        # Maximum diagnostic history to keep
enablePerformanceTracking: true

# QUALIA.CODE v1.1: Environment information (externalized from process.env)
environment: "development"   # Application environment (development, production, test)
version: "0.1.0"             # Application version

# Default values for system metrics
defaultMetrics:
  temperature: 60             # Default temperature in Celsius
  frameTime: 16.67            # Default frame time in milliseconds (~60fps)
  memoryConversionFactor: 1048576  # 1024 * 1024 for bytes to MB conversion
  fps: 60                     # Default FPS average

services:
  NotificationService:
    enabled: true
    priority: 1
  ErrorReportingService:
    enabled: true
    priority: 2
  ConfigurationService:
    enabled: true
    priority: 3
  EventBus:
    enabled: true
    priority: 4
  GameControllerService:
    enabled: true
    priority: 5
  QualiaStateCalculatorService:
    enabled: true
    priority: 6
  BackendSyncService:
    enabled: true
    priority: 7
  GameStateStoreService:
    enabled: true
    priority: 8
