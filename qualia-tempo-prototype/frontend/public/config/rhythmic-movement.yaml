enabled: true
updateInterval: 16
smoothingFactor: 0.8
deadzone: 0.05

movement:
  gridSize: 8
  speed: 5.0
  acceleration: 2.0
  friction: 0.9
  maxVelocity: 10.0

rhythm:
  beatDetection: true
  tempo: 120
  beatWindow: 100
  syncThreshold: 0.8

visualization:
  trailLength: 20
  trailFade: 0.95
  particleCount: 50
  colorIntensity: 1.0

# Core rhythm game settings
timing:
  perfectTiming: 50
  rhythmGoodTiming: 100
  okTiming: 150

slowdown:
  slowdownFactor: 0.5
  slowdownDuration: 1000

input:
  keyThrottleMs: 100
  mouseSensitivity: 1.0
  keyboardSpeed: 200
  gamepadDeadzone: 0.1
  touchSensitivity: 1.2

# Service messages for logging
messages:
  serviceInitialized: "RhythmicMovementController initialized successfully"
  serviceStarted: "RhythmicMovementController started and listening for events"
  serviceStopped: "RhythmicMovementController stopped"
