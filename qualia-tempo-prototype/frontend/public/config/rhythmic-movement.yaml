enabled: true
updateInterval: 16
smoothingFactor: 0.8
deadzone: 0.05
bpm: 120
perfectTiming: 50
goodTiming: 100
gridSize: 16
keyThrottleMs: 100

movement:
  gridSize: 16
  speed: 5.0
  acceleration: 2.0
  friction: 0.9
  maxVelocity: 10.0

# Grid coordinate system configuration
# Used by CoordinateSystemService for grid-to-world transformations
coordinate_system:
  gridSize: 16  # Grid dimensions (16x16)
  tileSize: 1  # Size of each tile in world units
  gridPlaneTolerance: 0.1  # Tolerance for Y-axis validation in worldToGrid (world units)
  
  # Service messages for logging
  messages:
    serviceInitialized: "CoordinateSystemService initialized with grid configuration"
    gridToWorldCalculated: "Grid coordinates transformed to world coordinates"
    worldToGridCalculated: "World coordinates transformed to grid coordinates"
    worldToScreenCalculated: "World coordinates projected to screen coordinates"
    invalidGridCoordinates: "Invalid grid coordinates provided"
    invalidWorldCoordinates: "Invalid world coordinates provided - outside grid bounds"
    cameraProjectionFailed: "Camera projection failed - using fallback coordinates"
    worldYOutOfPlane: "World Y coordinate is outside grid plane tolerance"

rhythm:
  beatDetection: true
  tempo: 120
  beatWindow: 100
  syncThreshold: 0.8

visualization:
  trailLength: 20
  trailFade: 0.95
  particleCount: 50
  colorIntensity: 1.0

# Core rhythm game settings
timing:
  perfectTiming: 50
  rhythmGoodTiming: 100
  okTiming: 150

slowdown:
  slowdownFactor: 0.5
  slowdownDuration: 1000

input:
  keyThrottleMs: 100
  mouseSensitivity: 1.0
  keyboardSpeed: 200
  gamepadDeadzone: 0.1
  touchSensitivity: 1.2

# Externalized hardcoded values
secondsPerMinute: 60
audioBeatDetectionThreshold: 0.5
availableMovements: ["dash", "attack", "defense", "special"]
optimalTimingPredictionConfidencePlaying: 0.85
optimalTimingPredictionConfidenceNotPlaying: 0.5
sequenceDifficultyBaseComplexityMultiplier: 0.1
sequenceDifficultyVarietyBonusMultiplier: 0.05
flowBpmMultiplier: 0.3
# initialPlayerPositionOffset: [0, 0] # Uncomment if specific offset needed

# Service messages for logging
messages:
  serviceInitialized: "RhythmicMovementController initialized successfully"
  serviceStarted: "RhythmicMovementController started and listening for events"
  serviceStopped: "RhythmicMovementController stopped"
