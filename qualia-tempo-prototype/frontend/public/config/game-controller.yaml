gameLifecycle:
  autoStart: true
  enablePause: true
  enableReset: true
  saveStateOnExit: true

performance:
  updateIntervalMs: 16
  maxFrameSkip: 5
  enableFrameRateLimiting: true

stateManagement:
  enableStateValidation: true
  enableStatePersistence: true
  stateSaveInterval: 5000
  maxSaveSlots: 10

inputHandling:
  enableInputBuffering: true
  inputBufferSize: 10
  enableInputFiltering: true
  inputDebounceMs: 50

scoring:
  baseScorePerHit: 100
  comboMultiplier: 1.5
  maxComboMultiplier: 10.0
  scoreDecayRate: 0.95
  perfectHitBonusMultiplier: 0.5

health:
  maxHealth: 100
  healthRegenRate: 0.1
  damageOnMiss: 5
  healthRecoveryOnHit: 2
  enableInvincibilityFrames: false
  invincibilityDuration: 1000

mechanics:
  fastForwardScoreBoost: 2.0
  rewindHealthBonus: 10
  dashScoreBonus: 5

# Legacy compatibility (removed - no longer needed)
# maxHealth: 100
# initialScore: 0
# comboMultiplier: 1.5
# healthDecayRate: 0.1

difficulty:
  adaptiveDifficulty: true
  difficultyIncreaseRate: 0.1
  maxDifficulty: 5.0
  minDifficulty: 0.5

events:
  enableEventBuffering: true
  maxEventQueueSize: 100
  eventProcessingInterval: 16

maxPlayers: 1
enablePauseResume: true
enableGameStateValidation: true
enablePerformanceMonitoring: true
autoSaveEnabled: true
autoSaveIntervalMs: 30000

# Service messages for logging
messages:
  eventsSubscribed: "✅ [GameController] Events subscribed successfully"
  fastForwardActivated: "⚡ [GameController] Fast forward mode activated"
