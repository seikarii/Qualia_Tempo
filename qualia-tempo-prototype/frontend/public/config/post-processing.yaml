# QUALIA.CODE v1.1 - PostProcessingService Orchestration Configuration
# Master configuration for dynamic post-processing pipeline

enabled: true
renderTargetWidth: 1920
renderTargetHeight: 1080

# Orchestration settings for pass management
orchestration:
  # Individual pass enable/disable flags
  taaEnabled: false          # TAA disabled by default (requires JitterService integration)
  bloomEnabled: true         # Professional bloom with mipmap chain
  motionBlurEnabled: false   # Velocity-based motion blur
  dofEnabled: false          # Depth of field with bokeh
  
  # Execution order of passes (critical for visual quality)
  # TAA first for temporal stability, Bloom last for glow on final image
  passOrder:
    - 'taa'           # Temporal Anti-Aliasing (max stability when enabled)
    - 'dof'           # Depth of Field (operates on stable image)
    - 'motionBlur'    # Motion Blur (controlled blur)
    - 'bloom'         # Bloom (final glow effect)
  
  # Performance settings
  performance:
    enableProfiling: false    # Enable per-pass performance tracking
    targetFrameTime: 16.67    # Target frame time in ms (60 FPS)
    autoQualityAdjust: false  # Automatically adjust quality based on performance

# CRISALIDA.CODE v2.0: Bloom Pass Configuration
# Professional bloom effect with mipmap chain (replaces @react-three/postprocessing version)
bloom:
  intensityMultiplier: 2.0      # Base intensity multiplier (can be modulated by QualiaState.intensity)
  luminanceThreshold: 0.1       # Brightness threshold for bloom (0.0 - 1.0)
  luminanceSmoothing: 0.9       # Smoothness of threshold transition (0.0 - 1.0)
  mipmapBlurRadius: 5.0         # Blur radius for mipmap downsampling
  mipmapLevels: 5               # Number of mipmap levels for bloom blur

# CRISALIDA.CODE v2.0: Chromatic Aberration Configuration
# Color fringing effect simulating lens distortion (replaces @react-three/postprocessing version)
chromaticAberration:
  enabled: true                  # Enable chromatic aberration effect
  baseOffset: 0.0005             # Base offset for color channels (in screen space)
  chaosMultiplier: 0.002         # Multiplier for QualiaState.chaos (dynamic modulation)
  radialModulation: false        # Enable radial distortion (more pronounced at screen edges)
  modulationOffset: 0.15         # Offset for radial modulation
