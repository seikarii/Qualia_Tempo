enabled: true
renderTargetWidth: 1920
renderTargetHeight: 1080
passes:
  - type: 'RenderPass'
    enabled: true
  - type: 'UnrealBloomPass'
    enabled: true
    name: 'BloomResult' # Nombre para identificar el resultado
    params:
      strength: 0.8
      radius: 0.6
      threshold: 0.75
  - type: 'ShaderPass'
    enabled: true
    shader: 'composite_pass' # El nuevo shader adaptado
    uniforms:
      # tDiffuse se asigna automáticamente
      tBloom: { value: null } # Se asignará dinámicamente
      exposure: { value: 1.0 }
      contrast: { value: 1.1 }
      saturation: { value: 1.2 }
      gamma: { value: 2.2 }