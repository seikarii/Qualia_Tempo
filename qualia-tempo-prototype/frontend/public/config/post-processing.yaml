# QUALIA.CODE v4.3 - Post-Processing Pipeline Configuration
# SSR V2 Integration with Advanced Screen Space Reflections
# 
# ARCHITECTURE:
# Pipeline 1: GBuffer Generation
# Pipeline 2: SSR Calculation  
# Pipeline 3: Final Composite
#
# CRITICAL: SSR V2 requires all 4 G-Buffer textures:
# - gBuffer_Color: Scene diffuse color
# - gBuffer_Normal: View-space normals
# - gBuffer_Depth: Linear depth [0,1]
# - gBuffer_Material: PBR properties (metallic, roughness, emissive)

# Global configuration
renderTargetWidth: 1920
renderTargetHeight: 1080

# Render targets definition
renderTargets:
  # G-Buffer outputs
  - name: gbuffer_color
    width: 1920
    height: 1080
    format: UnsignedByte
    options:
      minFilter: Linear
      magFilter: Linear

  - name: gbuffer_normal
    width: 1920
    height: 1080
    format: UnsignedByte
    options:
      minFilter: Linear
      magFilter: Linear

  - name: gbuffer_depth
    width: 1920
    height: 1080
    format: Float
    options:
      minFilter: Linear
      magFilter: Linear

  - name: gbuffer_material
    width: 1920
    height: 1080
    format: Float
    options:
      minFilter: Linear
      magFilter: Linear

  # HBAO output (CRISALIDA.CODE v1.1 - Phase 3)
  - name: hbao_occlusion
    width: 1920
    height: 1080
    format: UnsignedByte
    options:
      minFilter: Linear
      magFilter: Linear

  # SSR output
  - name: ssr_reflections
    width: 1920
    height: 1080
    format: HalfFloat
    options:
      minFilter: Linear
      magFilter: Linear

  # Composite buffer
  - name: composite_buffer
    width: 1920
    height: 1080
    format: HalfFloat
    options:
      minFilter: Linear
      magFilter: Linear

# Pipeline definitions
pipelines:
  # ============================================================================
  # PIPELINE 1: G-Buffer Generation
  # Generates all required textures for SSR in a single MRT pass
  # ============================================================================
  - name: gbuffer_pipeline
    output: gbuffer_color  # Primary output (others are generated via MRT)
    passes:
      - type: GBufferPass
        enabled: true
        # GBufferPass automatically generates 4 textures via MRT:
        # - gbuffer_color (COLOR_ATTACHMENT0)
        # - gbuffer_normal (COLOR_ATTACHMENT1)  
        # - gbuffer_depth (COLOR_ATTACHMENT2)
        # - gbuffer_material (COLOR_ATTACHMENT3)

  # ============================================================================
  # PIPELINE 2: HBAO (Horizon-Based Ambient Occlusion) - CRISALIDA.CODE v1.1
  # High-quality ambient occlusion for enhanced depth perception
  # ============================================================================
  - name: hbao_pipeline
    output: hbao_occlusion
    passes:
      - type: HBAOPass
        enabled: true
        params:
          radius: 1.5        # Sampling radius in view space
          bias: 0.025        # Bias to prevent self-occlusion artifacts
          numDirections: 8   # Number of sampling directions (quality)
          numSteps: 4        # Steps per direction (quality vs performance)

  # ============================================================================
  # PIPELINE 3: SSR V2 Calculation
  # Advanced screen-space reflections with adaptive ray-marching
  # ============================================================================
  - name: ssr_pipeline
    output: ssr_reflections
    passes:
      - type: SSRPass
        enabled: true
        params:
          maxSteps: 64       # Maximum ray-marching steps
          stride: 2.0        # Step size multiplier
          thickness: 0.5     # Hit detection threshold
          maxDistance: 50.0  # Maximum ray travel distance
          gBuffer_Color:
            value: gbuffer_color
          gBuffer_Normal:
            value: gbuffer_normal
          gBuffer_Depth:
            value: gbuffer_depth
          gBuffer_Material:
            value: gbuffer_material
          
          # Camera matrices (auto-connected from active camera)
          # projectionMatrix: [AUTO-CONNECTED]
          # viewMatrix: [AUTO-CONNECTED]
          # cameraNear: [AUTO-CONNECTED]
          # cameraFar: [AUTO-CONNECTED]
          
          # Resolution (auto-set by PostProcessingService)
          # resolution: [AUTO-CONNECTED]
          
          # Quality parameters - TUNE THESE FOR PERFORMANCE/QUALITY BALANCE
          maxSteps:
            value: 64  # Range: 32-128. Higher = better quality, lower performance
          stride:
            value: 2.0  # Range: 1.0-8.0. Higher = faster but less accurate
          thickness:
            value: 0.3  # Range: 0.1-0.5. Surface detection thickness
          maxDistance:
            value: 100.0  # Range: 50.0-200.0. Maximum ray travel distance

  # ============================================================================
  # PIPELINE 4: Final Composite - CRISALIDA.CODE v1.1 Phase 4
  # HDR composition with ACES tone mapping, bloom, and color grading
  # ============================================================================
  - name: composite_pipeline
    output: screen  # Final output to screen
    passes:
      # Bloom pass for glow effects
      - type: UnrealBloomPass
        enabled: true
        params:
          strength: 0.5
          radius: 0.3
          threshold: 0.9

      # Final HDR composition
      - type: ShaderPass
        enabled: true
        shader: composite_pass
        uniforms:
          tDiffuse:
            value: gbuffer_color
          tBloom:
            value: composite_buffer  # Bloom output
          bloomStrength:
            value: 0.8
          exposure:
            value: 1.0       # HDR exposure compensation (-3.0 to +3.0)
          contrast:
            value: 1.2       # Contrast adjustment (0.5-2.0)
          saturation:
            value: 1.1       # Color saturation (0.0-2.0)
          gamma:
            value: 2.2       # Gamma correction (1.8-2.4)
          blendMode:
            value: 1         # 0=Additive, 1=Screen, 2=Overlay, 3=SoftLight
          # TODO: Integrate HBAO and SSR textures in composite shader

# Pipeline execution order - CRISALIDA.CODE v1.1: GBuffer → HBAO → SSR → Composite
pipelineOrder:
  - gbuffer_pipeline
  - hbao_pipeline
  - ssr_pipeline
  - composite_pipeline

# ============================================================================
# SSR V2 TUNING GUIDE
# ============================================================================
#
# PERFORMANCE PRESETS:
#
# LOW (Mobile/Integrated GPU):
#   maxSteps: 32
#   stride: 4.0
#   thickness: 0.5
#   maxDistance: 50.0
#
# MEDIUM (Mid-range GPU):
#   maxSteps: 64
#   stride: 2.0
#   thickness: 0.3
#   maxDistance: 100.0
#
# HIGH (High-end GPU):
#   maxSteps: 128
#   stride: 1.0
#   thickness: 0.15
#   maxDistance: 200.0
#
# ULTRA (Enthusiast GPU):
#   maxSteps: 256
#   stride: 0.5
#   thickness: 0.1
#   maxDistance: 300.0
#
# ============================================================================
# ADVANCED TECHNIQUES IMPLEMENTED:
# ============================================================================
#
# 1. Adaptive Step Size: Ray-marching dynamically adjusts step size based on
#    distance to geometry, enabling faster traversal in empty space
#
# 2. Roughness-Aware Reflection: Material roughness controls reflection 
#    intensity - surfaces with roughness > 0.7 skip ray-marching entirely
#
# 3. Multi-Factor Confidence: Reflection strength based on:
#    - Ray travel distance (fade far reflections)
#    - Screen edge proximity (hide edge artifacts)
#    - Intersection precision (quality of hit detection)
#    - Surface angle (grazing angles fade out)
#
# 4. Metallic Boost: Metallic materials receive stronger reflections
#    to match physical behavior
#
# 5. View-Space Ray-Tracing: All calculations in view space for
#    maximum precision and minimal coordinate transformations
#
# ============================================================================
# TROUBLESHOOTING:
# ============================================================================
#
# ISSUE: Reflections appear noisy/grainy
# FIX: Increase maxSteps, decrease stride
#
# ISSUE: Reflections miss small details
# FIX: Decrease thickness, increase maxSteps
#
# ISSUE: Reflections disappear on rough surfaces
# FIX: Check material roughness values in G-Buffer (should be < 0.7)
#
# ISSUE: Performance is too low
# FIX: Decrease maxSteps, increase stride, decrease maxDistance
#
# ISSUE: Reflections cut off at screen edges
# FIX: This is inherent to screen-space techniques - consider hybrid
#      ray-tracing or environment map fallback for edge cases
#
# ============================================================================