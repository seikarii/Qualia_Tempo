  serviceNotRunning: "⚠️ [DebugService] Service not running"
  serviceStopping: "🛑 [DebugService] Stopping service..."
  serviceStopped: "🛑 [DebugService] Service stopped"
  serviceStopFailed: "🚨 [DebugService] Error stopping service:"
