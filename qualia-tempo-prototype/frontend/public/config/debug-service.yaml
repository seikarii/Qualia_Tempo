logging:
  enableConsoleOutput: true
  enableFileOutput: false
  logLevel: "INFO"
  maxLogFiles: 5
  maxLogSize: 10485760

eventMonitoring:
  enableEventLogging: true
  enableEventMetrics: true
  maxEventHistory: 500
  eventLogThrottle: 100

performance:
  enablePerformanceTracking: true
  enableMemoryMonitoring: true
  enableFrameRateTracking: true
  metricsUpdateInterval: 5000

development:
  enableDebugOverlay: false
  enableCheats: false
  enableHotReload: true
  enableBreakpoints: false

profiling:
  enableProfiling: false
  profileUpdateInterval: 1000
  maxProfileSamples: 1000

errorTracking:
  enableErrorStackTraces: true
  enableErrorReporting: true
  maxErrorHistory: 100

network:
  enableNetworkLogging: false
  enableRequestMetrics: false
  logRequestHeaders: false
  logRequestBodies: false

maxSessionHistory: 10
maxEventHistory: 500
performanceMonitoringInterval: 5000
aiAnalysisInterval: 30000
enableAIAnalysis: true
sessionIdLength: 8  # Random part length for session IDs
sessionIdPrefixLength: 2  # Characters to skip in random string (for "0." prefix)
memoryCleanupThreshold: 1000  # Threshold for memory cleanup
memoryCleanupInterval: 60000  # Memory cleanup interval in milliseconds
eventProcessingTimeThreshold: 50  # Threshold for slow event processing in ms
memoryCleanupRatio: 0.8  # Ratio of history to keep during cleanup
maxAIAnalysisHistory: 50  # Maximum number of AI analysis results to keep
maxErrorHistory: 100  # Maximum number of error history entries to keep
aiAnalysisIntervalDefault: "30000ms"  # Default AI analysis interval string
enableAIAnalysisDefault: true  # Default AI analysis enabled state
memoryCleanupThresholdDefault: 1000  # Default memory cleanup threshold

messages:
  serviceInitialized: "🔧 [DebugService] Service initialized with AI debugging capabilities and pure DI"
  configLoaded: "DebugService configuration loaded successfully."
  configLoadFailed: "🚨 [DebugService] Failed to load configuration. Service cannot start."
