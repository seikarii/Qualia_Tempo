autoStart: true
enableBackendSync: true
enableHealthMonitoring: true
healthCheckIntervalMs: 30000
retryInitializationOnError: true
maxInitializationRetries: 3
serviceInitializationTimeoutMs: 10000
serviceShutdownTimeoutMs: 5000
enableServiceLifecycleLogging: true
enablePerformanceMonitoring: true

logging:
  serviceInitMessage: "Application Bootstrap: Initializing services..."
  serviceInitCompleteMessage: "✅ [BOOTSTRAP] Service layer initialization completed successfully"
  appStartMessage: "Application Bootstrap: Starting application..."
  appStartCompleteMessage: "✅ [BOOTSTRAP] Application startup completed successfully"
  uiBridgeSuccessMessage: "✅ [BOOTSTRAP] UI-Service bridge established successfully"
  uiBridgeErrorMessage: "❌ [BOOTSTRAP] Failed to connect store to services:"
  debugAttachMessage: "🌐 [BOOTSTRAP] Debug interface attached to window."
  debugAttachErrorMessage: "⚠️ [BOOTSTRAP] Failed to attach debug interface:"
  shutdownStartMessage: "Application Shutdown: Cleaning up services..."
  shutdownCompleteMessage: "Application Shutdown: Complete."
  shutdownErrorMessage: "[SHUTDOWN ERROR]"

http:
  defaultTimeout: 30000
  maxRetries: 3
  retryDelay: 1000

steps:
  loadConfiguration: "Loading game configuration..."
  configureHttpService: "Configuring HTTP service..."
  startGameStateService: "Starting game state management..."
  startTransversalServices: "Starting transversal services..."
  startGameController: "Starting game controller..."
  startRhythmicController: "Starting rhythmic movement controller..."
  startBackendSync: "Starting backend synchronization..."
