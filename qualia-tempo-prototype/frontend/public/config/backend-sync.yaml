api:
  baseUrl: "http://127.0.0.1:8000"
  qualiaEndpoint: "/qualia"
  audioDataEndpoint: "/audio_data" # PHASE 4: FFT analysis data endpoint
  healthEndpoint: "/health"
  timeout: 5000

streaming:
  websocket:
    url: "ws://127.0.0.1:8000/ws/video_stream"
    maxReconnectAttempts: 10
    reconnectDelay: 2000
    pingInterval: 8000
    pingTimeout: 6000
    connectionTimeout: 10000
    normalCloseCode: 1000

sync:
  throttleDelay: 100
  batchSize: 10
  maxRetries: 3
  retryDelay: 1000

connection:
  healthCheckInterval: 30000
  connectionTimeout: 5000
  maxFailedAttempts: 5

validation:
  enableSchemaValidation: true

messages:
  serviceInitialized: "BackendSyncService initialized - configuration will be loaded on demand"
  syncStarted: "🚀 [BackendSync] Starting service..."
  serviceAlreadyRunning: "⚠️ [BackendSync] Service already running"
  serviceStartedSuccessfully: "✅ [BackendSync] Service started successfully"
  stopCalled: "🛑 [BackendSync] Stop called"
  serviceNotRunning: "⚠️ [BackendSync] Service not running"
  updateConfigCalled: "⚙️ [BackendSync] UpdateConfig called"
  forceSyncCalled: "⚡ [BackendSync] ForceSync called"
  qualiaStateCalculated: "📊 [BackendSync] QualiaState calculated from frontend"
  syncStopped: "Backend sync service stopped"
  connectionEstablished: "Connection to backend established"
  connectionLost: "Connection to backend lost"
  syncThrottled: "Sync throttled due to high frequency"
  syncError: "Error during sync operation"
