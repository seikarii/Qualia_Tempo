<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qualia Tempo - A Charlie Hellsinger Story</title>
    <!-- Modern Typography: Orbitron for titles, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* QUALIA.CODE v6 - Modern Cyberpunk UI Framework */
      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        background: #000;
        overflow: hidden;
      }

      /* Procedural Grid Background */
      .cyber-grid {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: gridFlow 20s linear infinite;
        z-index: -1;
      }

      @keyframes gridFlow {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
      }

      /* Glitch Effect Keyframes */
      @keyframes glitch {
        0% { 
          transform: translate(0);
          filter: hue-rotate(0deg);
        }
        20% { 
          transform: translate(-2px, 2px);
          filter: hue-rotate(90deg);
        }
        40% { 
          transform: translate(-2px, -2px);
          filter: hue-rotate(180deg);
        }
        60% { 
          transform: translate(2px, 2px);
          filter: hue-rotate(270deg);
        }
        80% { 
          transform: translate(2px, -2px);
          filter: hue-rotate(360deg);
        }
        100% { 
          transform: translate(0);
          filter: hue-rotate(0deg);
        }
      }

      /* Neon Glow Effect */
      .neon-glow {
        text-shadow: 
          0 0 5px #00ffff,
          0 0 10px #00ffff,
          0 0 15px #00ffff,
          0 0 20px #00ffff;
      }

      /* Pulse Animation */
      @keyframes neonPulse {
        0%, 100% { 
          text-shadow: 
            0 0 5px #00ffff,
            0 0 10px #00ffff,
            0 0 15px #00ffff;
        }
        50% { 
          text-shadow: 
            0 0 10px #00ffff,
            0 0 20px #00ffff,
            0 0 30px #00ffff,
            0 0 40px #00ffff;
        }
      }

      /* Health Vignette Effect */
      .health-vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: radial-gradient(circle, transparent 60%, rgba(255, 0, 0, 0.1) 100%);
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 50;
      }

      /* Custom Qualia animations */
      @keyframes qualiaIntensity {
        0% {
          box-shadow: 0 0 0 rgba(0, 255, 255, 0);
        }
        50% {
          box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }
        100% {
          box-shadow: 0 0 0 rgba(0, 255, 255, 0);
        }
      }

      @keyframes qualiaFlow {
        0% {
          transform: translateX(-100%);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateX(100%);
          opacity: 0;
        }
      }

      @keyframes qualiaChaos {
        0% {
          transform: rotate(0deg) scale(1);
          filter: hue-rotate(0deg);
        }
        25% {
          transform: rotate(90deg) scale(1.1);
          filter: hue-rotate(90deg);
        }
        50% {
          transform: rotate(180deg) scale(0.9);
          filter: hue-rotate(180deg);
        }
        75% {
          transform: rotate(270deg) scale(1.05);
          filter: hue-rotate(270deg);
        }
        100% {
          transform: rotate(360deg) scale(1);
          filter: hue-rotate(360deg);
        }
      }

      /* Score Punch Animation */
      @keyframes scorePunch {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
      }

      /* Button Hover Effects */
      .cyber-button {
        position: relative;
        background: linear-gradient(45deg, rgba(147, 51, 234, 0.8), rgba(79, 70, 229, 0.8));
        border: 2px solid #00ffff;
        transition: all 0.3s ease;
      }

      .cyber-button:hover {
        animation: glitch 0.3s ease-in-out;
        box-shadow: 
          0 0 20px rgba(0, 255, 255, 0.5),
          inset 0 0 20px rgba(147, 51, 234, 0.3);
      }

      .cyber-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
      }

      .cyber-button:hover::before {
        left: 100%;
      }

      /* Prevent text selection during gameplay */
      .no-select {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(0, 255, 255, 0.5);
        border-radius: 2px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 255, 255, 0.8);
      }
    </style>
  </head>
  <body class="no-select">
    <!-- Procedural Cyber Grid Background -->
    <div class="cyber-grid"></div>
    
    <!-- Health Damage Vignette -->
    <div id="health-vignette" class="health-vignette"></div>
    
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
