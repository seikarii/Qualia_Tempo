# QUALIA.CODE v1.0 - NotificationService Configuration
# External configuration for notifications and user feedback

# Display settings
display:
  enableNotifications: true
  maxVisibleNotifications: 5
  notificationDuration: 3000 # 3 seconds
  enableAnimations: true
  animationDuration: 300 # 300ms

# Positioning
positioning:
  position: "top-right" # top-left, top-right, bottom-left, bottom-right, center
  offsetX: 20
  offsetY: 20
  zIndex: 1000

# Styling
styling:
  enableThemes: true
  defaultTheme: "qualia"
  enableCustomStyling: true
  borderRadius: 8
  shadowEnabled: true

# Sound settings
sound:
  enableNotificationSounds: true
  defaultSoundVolume: 0.5
  enableSoundVariations: true

# Types configuration
types:
  success:
    duration: 3000
    soundEnabled: true
    color: "#10b981"
  error:
    duration: 5000
    soundEnabled: true
    color: "#ef4444"
  warning:
    duration: 4000
    soundEnabled: true
    color: "#f59e0b"
  info:
    duration: 3000
    soundEnabled: false
    color: "#3b82f6"

# Queue management
queue:
  enableQueueing: true
  maxQueueSize: 20
  queueProcessingInterval: 100 # Process every 100ms

# Accessibility
accessibility:
  enableScreenReader: true
  enableHighContrast: false
  enableReducedMotion: false
  enableKeyboardNavigation: true

# Performance
performance:
  enablePooling: true
  maxPoolSize: 10
  enableGarbageCollection: true
  gcInterval: 30000 # 30 seconds
