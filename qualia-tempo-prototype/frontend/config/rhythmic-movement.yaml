# QUALIA.CODE v1.1 - RhythmicMovement Configuration
# External configuration for rhythmic movement and timing mechanics

# Core timing configuration
bpm: 120                    # Beats per minute for the game
perfectTiming: 100          # Perfect timing window in milliseconds
goodTiming: 200            # Good timing window in milliseconds

# Grid and movement
gridSize: 32               # Grid size for movement
slowdownFactor: 0.3        # Factor for slowdown effect (0.0 to 1.0)
slowdownDuration: 500      # Duration of slowdown effect in milliseconds

# Input throttling
keyThrottleMs: 50          # Key input throttling in milliseconds
