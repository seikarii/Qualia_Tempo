# QUALIA.CODE v1.0 - DebugService Configuration
# External configuration for debugging and monitoring

# Logging configuration
logging:
  enableConsoleOutput: true
  enableFileOutput: false
  logLevel: "INFO" # DEBUG, INFO, WARN, ERROR
  maxLogFiles: 5
  maxLogSize: 10485760 # 10MB per file

# Event monitoring
eventMonitoring:
  enableEventLogging: true
  enableEventMetrics: true
  maxEventHistory: 1000
  eventLogThrottle: 100 # Log every 100ms max

# Performance monitoring
performance:
  enablePerformanceTracking: true
  enableMemoryMonitoring: true
  enableFrameRateTracking: true
  metricsUpdateInterval: 1000 # 1 second

# Development features
development:
  enableDebugOverlay: false
  enableCheats: false
  enableHotReload: true
  enableBreakpoints: true

# Profiling
profiling:
  enableProfiling: false
  profileUpdateInterval: 5000 # 5 seconds
  maxProfileSamples: 1000

# Error tracking
errorTracking:
  enableErrorStackTraces: true
  enableErrorReporting: true
  maxErrorHistory: 100

# Network debugging
network:
  enableNetworkLogging: false
  enableRequestMetrics: false
  logRequestHeaders: false
  logRequestBodies: false
