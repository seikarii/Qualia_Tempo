# QUALIA.CODE v1.0 - BackendSyncService Configuration
# External configuration for backend synchronization

# API endpoints
api:
  baseUrl: "http://127.0.0.1:8000"
  qualiaEndpoint: "/update_qualia"
  healthEndpoint: "/health"
  timeout: 10000  # 10 seconds - increased for stability

# WebSocket streaming configuration
streaming:
  websocket:
    url: "ws://127.0.0.1:8000/ws/video_stream"
    maxReconnectAttempts: 10
    reconnectDelay: 2000  # 2 seconds
    pingInterval: 8000    # 8 seconds (increased from 5s for stability)
    pingTimeout: 6000     # 6 seconds (increased from 3s for stability)
    connectionTimeout: 10000  # 10 seconds

# Synchronization settings
sync:
  throttleDelay: 250     # Throttle updates to 250ms
  batchSize: 5          # Send in batches of 5
  maxRetries: 3         # Max retry attempts
  retryDelay: 1000      # 1 second between retries

# Connection monitoring
connection:
  healthCheckInterval: 30000  # 30 seconds
  connectionTimeout: 10000    # 10 seconds
  maxFailedAttempts: 5

# Data validation
validation:
  enableSchemaValidation: true
  strictMode: false
  logValidationErrors: true

# Performance settings
performance:
  enableCompression: true
  maxPayloadSize: 1048576  # 1MB
  enableBuffering: true
  bufferFlushInterval: 1000  # 1 second

# Error handling
errorHandling:
  enableCircuitBreaker: true
  circuitBreakerThreshold: 10
  circuitBreakerTimeout: 60000  # 1 minute
  enableFallbackMode: true

# Messages (QUALIA.CODE: Externalize all user-facing messages)
messages:
  backendNotConnected: "Backend not connected, skipping sync"
  serviceAlreadyRunning: "Service already running"
  serviceNotRunning: "Service not running"
  syncScheduled: "Sync scheduled in {delay}ms"
  sendingQualiaState: "Sending QualiaState to backend"
  backendResponse: "Backend response received"
  syncCompleted: "Sync completed in {duration}ms"
  syncFailed: "Sync failed after {duration}ms"
  healthCheck: "Performing health check"
  backendHealthy: "Backend is healthy"
  healthCheckFailed: "Health check failed after {duration}ms"
  periodicHealthCheckFailed: "Periodic health check failed"
  serviceStarted: "Service started successfully"
  serviceStopped: "Service stopped successfully"
  startFailed: "Service start failed after {duration}ms"
  stopFailed: "Service stop failed after {duration}ms"
  updateConfig: "Configuration updated"
  updateConfigFailed: "Configuration update failed after {duration}ms"
  forceSync: "Force sync initiated"
  forceSyncCompleted: "Force sync completed in {duration}ms"
  forceSyncFailed: "Force sync failed after {duration}ms"