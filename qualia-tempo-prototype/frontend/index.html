<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qualia Tempo - A Charlie Hellsinger Story</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        background: #000;
        overflow: hidden;
      }

      /* Custom animations for Qualia effects */
      @keyframes qualiaflow {
        0% {
          transform: translateX(-100%);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateX(100%);
          opacity: 0;
        }
      }

      @keyframes qualiachaos {
        0% {
          transform: rotate(0deg) scale(1);
        }
        25% {
          transform: rotate(90deg) scale(1.2);
        }
        50% {
          transform: rotate(180deg) scale(0.8);
        }
        75% {
          transform: rotate(270deg) scale(1.1);
        }
        100% {
          transform: rotate(360deg) scale(1);
        }
      }

      .qualia-flow {
        animation: qualiaflow 2s ease-in-out infinite;
      }

      .qualia-chaos {
        animation: qualiachaos 0.5s ease-in-out infinite;
      }

      /* Prevent text selection during gameplay */
      .no-select {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Custom scrollbar for debug panels */
      ::-webkit-scrollbar {
        width: 4px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
      }
    </style>
  </head>
  <body class="no-select">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
