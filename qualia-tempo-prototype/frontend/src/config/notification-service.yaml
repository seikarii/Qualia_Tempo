# NotificationService Configuration
# Defines notification behavior, timing, and message templates

# Display settings
display:
  defaultDuration: 3000        # Default notification display time (ms)
  fadeInDuration: 300          # Fade in animation time (ms)
  fadeOutDuration: 500         # Fade out animation time (ms)
  maxConcurrentNotifications: 5 # Maximum notifications shown simultaneously
  stackVertically: true        # Whether notifications stack vertically
  
# Position and layout
position:
  horizontalAlignment: "center" # left, center, right
  verticalAlignment: "top"      # top, center, bottom
  marginTop: 20                 # Pixels from top edge
  marginSide: 20                # Pixels from side edges
  
# Notification types and styling
types:
  info:
    backgroundColor: "#2196F3"   # Blue
    textColor: "#FFFFFF"
    icon: "ℹ️"
    duration: 3000
  success:  
    backgroundColor: "#4CAF50"   # Green
    textColor: "#FFFFFF"
    icon: "✅"
    duration: 2500
  warning:
    backgroundColor: "#FF9800"   # Orange
    textColor: "#FFFFFF"  
    icon: "⚠️"
    duration: 4000
  error:
    backgroundColor: "#F44336"   # Red
    textColor: "#FFFFFF"
    icon: "❌"
    duration: 5000
  achievement:
    backgroundColor: "#9C27B0"   # Purple
    textColor: "#FFFFFF"
    icon: "🏆"
    duration: 4000
    
# Animation settings
animations:
  enableAnimations: true        # Whether to animate notifications
  slideDistance: 50             # Pixels to slide during animation
  bounceEffect: false           # Add bounce effect to animations
  
# Behavior settings  
behavior:
  autoHide: true                # Automatically hide notifications
  pauseOnHover: true            # Pause auto-hide when hovering
  clickToDismiss: true          # Allow clicking to dismiss
  soundEnabled: false           # Play sound on notification
  vibrationEnabled: false       # Vibrate on mobile devices
  
# Queue management
queue:
  maxQueueSize: 20              # Maximum queued notifications
  priorityQueue: true           # Process higher priority first
  batchSimilarNotifications: true # Group similar notifications
  
# System messages
messages:
  serviceInitialized: "🔔 [NotificationService] Service initialized successfully"
  serviceStarted: "🔔 [NotificationService] Service started - ready to display notifications"  
  serviceStopped: "🔔 [NotificationService] Service stopped - clearing all notifications"
  queueFull: "Notification queue is full - dropping oldest notifications"
  notificationShown: "🔔 [Notification] Displaying notification"
  notificationHidden: "🔔 [Notification] Notification hidden"
  allNotificationsCleared: "🔔 [Notification] All notifications cleared"
  
# Templates for common notifications
templates:
  gameStarted: "🎮 Game Started! Good luck!"
  gameOver: "💀 Game Over! Final Score: {score}"
  levelUp: "⬆️ Level Up! Now at level {level}"
  achievement: "🏆 Achievement Unlocked: {name}"
  connectionLost: "❌ Connection to server lost - retrying..."
  connectionRestored: "✅ Connection restored!"
  savingProgress: "💾 Saving progress..."
  progressSaved: "✅ Progress saved successfully!"
  
# Error handling
errors:
  invalidNotificationType: "Invalid notification type specified"
  missingNotificationContent: "Notification content is required"
  serviceNotInitialized: "NotificationService not initialized"
  
# Development and debugging
debug:
  logAllNotifications: false    # Log every notification creation
  logQueueOperations: false     # Log queue add/remove operations
  logAnimations: false          # Log animation start/end
  showDebugOverlay: false       # Show debug information overlay
