# BackendSyncService Configuration
# Defines connection parameters, sync intervals, and error handling

# Connection settings
connection:
  baseUrl: "http://localhost:8000"
  healthCheckInterval: 5000  # milliseconds
  connectionTimeout: 10000   # milliseconds
  maxRetries: 3
  retryDelay: 1000          # milliseconds

# Synchronization settings
sync:
  throttleInterval: 250     # milliseconds - throttle rapid state updates
  batchSize: 10            # maximum number of state updates to batch
  maxPendingRequests: 5    # maximum concurrent requests

# Health monitoring
health:
  pingEndpoint: "/health"
  pingInterval: 30000      # 30 seconds
  maxFailedPings: 3        # before marking as disconnected

# Logging and status messages
messages:
  serviceInitialized: "🔄 [BackendSync] Service initialized"
  configurationConstructed: "BackendSyncService constructed - configuration will be loaded when start() is called"
  configurationLoaded: "BackendSyncService configuration loaded successfully"
  configurationFailed: "Failed to load BackendSyncService configuration"
  configurationNotAvailable: "BackendSyncService configuration not available"
  serviceStarted: "🔄 [BackendSync] Service started successfully"
  serviceStopped: "🔄 [BackendSync] Service stopped"
  connectionEstablished: "🔗 [BackendSync] Backend connection established"
  connectionLost: "❌ [BackendSync] Backend connection lost"
  syncStarted: "�� [BackendSync] Starting synchronization with backend"
  syncCompleted: "✅ [BackendSync] Synchronization completed"
  syncFailed: "❌ [BackendSync] Synchronization failed"
  healthCheckStarted: "🩺 [BackendSync] Health check monitoring started"
  healthCheckPassed: "✅ [BackendSync] Health check passed"
  healthCheckFailed: "❌ [BackendSync] Health check failed"

# Error handling
errors:
  connectionTimeout: "Backend connection timeout"
  invalidResponse: "Invalid response from backend"
  networkError: "Network error during backend communication"
  configurationError: "Backend configuration error"
  
# Development and debugging
debug:
  logAllRequests: false
  logHealthChecks: true
  logStateUpdates: false
  verboseErrorReporting: true
