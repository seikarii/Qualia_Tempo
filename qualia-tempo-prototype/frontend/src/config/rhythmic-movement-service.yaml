# RhythmicMovementController Configuration
# Defines rhythm timing, movement mechanics, and synchronization parameters

# Core rhythm settings
rhythm:
  defaultBPM: 120              # Default beats per minute
  minBPM: 60                   # Minimum allowed BPM
  maxBPM: 200                  # Maximum allowed BPM
  beatToleranceMs: 50          # Milliseconds tolerance for beat detection

# Timing thresholds for input accuracy
timing:
  perfectTiming: 100           # Milliseconds window for perfect timing
  goodTiming: 200              # Milliseconds window for good timing  
  missThreshold: 300           # Beyond this = miss
  earlyBonus: 0.95             # Multiplier for slightly early hits
  lateBonus: 0.90              # Multiplier for slightly late hits

# Grid and movement system
movement:
  gridSize: 32                 # Grid size for movement calculations
  snapToGrid: true             # Whether movement snaps to grid
  smoothMovement: true         # Enable movement interpolation
  movementSpeed: 1.0           # Base movement speed multiplier

# Slowdown effect (temporal mechanics)
slowdown:
  slowdownFactor: 0.3          # Time dilation factor (0.3 = 30% speed)
  slowdownDuration: 500        # Duration of slowdown effect (ms)
  maxSlowdowns: 3              # Maximum concurrent slowdown effects
  cooldownMs: 1000             # Cooldown between slowdown uses

# Input handling
input:
  keyThrottleMs: 50            # Milliseconds between key press processing
  enableKeyRepeat: false       # Allow key repeat events
  gestureThreshold: 10         # Minimum gesture distance (pixels)
  doubleTapMs: 300             # Double tap detection window

# Metronome settings
metronome:
  enabled: true                # Whether metronome is active
  volume: 0.3                  # Metronome volume (0.0-1.0)
  visualBeat: true             # Show visual beat indicator
  soundBeat: false             # Play audio beat sound
  
# Synchronization and accuracy
sync:
  maxSyncDrift: 100            # Maximum acceptable sync drift (ms)
  resyncThreshold: 500         # When to trigger resynchronization
  accuracyWindow: 1000         # Window for accuracy calculations (ms)
  trackLatency: true           # Track and compensate for audio latency

# Logging and status messages  
messages:
  serviceInitialized: "RhythmicMovementController initialized - configuration will be loaded on start()"
  configurationLoaded: "Configuration loaded successfully"
  serviceStarted: "🎵 RhythmicMovementController started with configuration loaded"
  serviceStopped: "🎵 RhythmicMovementController stopped"
  metronomeStarted: "🥁 Metronome started"
  metronomeStopped: "🥁 Metronome stopped"
  inputListenerAdded: "⌨️ Input listener added"
  inputListenerRemoved: "⌨️ Input listener removed"
  invalidTimeWarning: "Invalid time provided for sync check, using current time"
  beatDetected: "🥁 Beat detected"
  syncAccuracyCalculated: "📊 Sync accuracy calculated"
  slowdownActivated: "⏱️ Slowdown effect activated"
  slowdownDeactivated: "⏱️ Slowdown effect deactivated"

# Performance monitoring
performance:
  trackFrameTime: true         # Monitor frame timing for performance
  logPerformanceIssues: true   # Log when performance degrades
  maxFrameTime: 16.67          # Target frame time (60fps = 16.67ms)
  performanceBufferSize: 100   # Number of performance samples to keep

# Development and debugging
debug:
  logBeatDetection: false      # Log every beat detection
  logInputEvents: false        # Log all input events
  logSyncCalculations: false   # Log synchronization calculations
  logMovementEvents: false     # Log movement calculations
  showDebugOverlay: false      # Display debug information overlay
  verboseConfigLoading: true   # Log detailed configuration loading

# Game integration
gameIntegration:
  pauseOnFocusLoss: true       # Pause when window loses focus
  resumeOnFocusGain: true      # Resume when window gains focus
  adjustForGameSpeed: true     # Adjust rhythm for game speed changes
  syncWithAudioEngine: true    # Synchronize with audio engine
