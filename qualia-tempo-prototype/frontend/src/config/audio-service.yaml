# AudioService Configuration
# Defines audio parameters, frequencies, and timing values

# Basic audio settings
volume: 0.8
defaultSoundDuration: 0.5  # Default duration for non-looping sounds in seconds
preloadSimulationDelay: 100  # Simulation delay for preloading in milliseconds
defaultFrequency: 440  # Default frequency (A4) for unknown sound IDs

# Sound frequency mapping
soundFrequencies:
  ui-click: 800
  ui-hover: 600
  game-hit: 440
  game-miss: 200
  game-success: 880
  game-fail: 150
  ambient: 220
  notification: 550

# Rhythmic feedback configuration (frequencies, gains, durations)
rhythmicFeedback:
  perfect:
    frequency: 880  # High pitch for perfect timing
    gain: 0.3
    duration: 0.1
  good:
    frequency: 660  # Medium pitch for good timing
    gain: 0.25
    duration: 0.15
  miss:
    frequency: 220  # Low pitch for missed timing
    gain: 0.2
    duration: 0.2

# Metronome configuration
metronome:
  frequency: 800  # Clear, sharp frequency for metronome ticks
  gain: 0.15
  duration: 0.05  # Short, crisp tick sound

# Entity voice settings
entityVoices:
  defaultEntities:
    - "player"
    - "boss"
    - "environment"

# Audio initialization settings
initialization:
  maxRetries: 3
  retryDelay: 1000  # milliseconds
  
# Logging and debugging
logging:
  logSoundPlayback: true
  logVolumeChanges: true
  logInitialization: true

# Warning and error messages
messages:
  notInitialized: "AudioService not initialized"
  cannotPlayRhythmicFeedback: "AudioService not initialized, cannot play rhythmic feedback"
  cannotCreateEntityVoice: "AudioService not initialized, cannot create entity voice"
  cannotRemoveEntityVoice: "AudioService not initialized, cannot remove entity voice"
  cannotRemoveEntityVoices: "AudioService not initialized, cannot remove entity voices"
  cannotPlaySound: "AudioService not initialized, cannot play sound"
  cannotStopSound: "AudioService not initialized, cannot stop sound"
  cannotPreloadSounds: "AudioService not initialized, cannot preload sounds"
  audioContextNotAvailable: "AudioContext not available, cannot play rhythmic feedback."
  audioContextNotAvailableSound: "AudioContext not available, cannot play sound."
  failedToPlayRhythmicFeedback: "Failed to play rhythmic feedback:"
  failedToPlaySound: "Failed to play sound:"
  preloadingSounds: "🔊 Preloading sounds:"
  soundsPreloaded: "✅ Sounds preloaded successfully"
  playingSound: "🔊 Playing sound:"
  stoppingSound: "🔇 Stopping sound:"
  masterVolumeSet: "🔊 Master volume set to:"
  rhythmicFeedback: "🔊 Rhythmic feedback:"
