# QUALIA.CODE v1.0 - Backend Server Configuration
# Configuration-First principle: All server settings externalized

server:
  host: "127.0.0.1"  # Changed from 0.0.0.0 to 127.0.0.1 for WebSocket compatibility
  port: 8000
  reload: false
  log_level: "info"
  workers: 1
  
  # Environment-specific overrides
  development:
    reload: true
    log_level: "debug"
  
  production:
    reload: false
    log_level: "warning"
    workers: 4

# CORS settings
cors:
  allow_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT" 
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "*"

# API settings
api:
  title: "Qualia Tempo Visual Engine"
  description: "QUALIA.CODE v1.0 - Event-Driven Rhythm Game Backend"
  version: "1.0.0"
  docs_url: "/docs"
  redoc_url: "/redoc"

# Logging configuration
logging:
  level: "info"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
# Performance settings
performance:
  max_request_size: 16777216  # 16MB

# Security configuration - QUALIA.CODE v1.1
security:
  websockets:
    auth_enabled: false  # Disabled for development/testing - set to true for production
    token_validation: "simple"  # simple, jwt, or database
    allowed_origins: 
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
  timeout: 30
  keepalive: 2

# Streaming configuration - QUALIA.CODE §7: Externalized streaming settings
streaming:
  target_fps: 30.0  # State update frequency for WebSocket streaming
