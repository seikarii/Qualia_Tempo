# ErrorReportingService Configuration
# QUALIA.CODE v1.1 Compliance - Phase 6.4

# Storage Configuration
max_errors_stored: 1000
max_breadcrumbs: 100
enable_error_persistence: false

# Backend Integration
enabled_backends:
  - "local"
sentry_dsn: ""
rollbar_access_token: ""
cloudwatch_log_group: "qualia-tempo-errors"
cloudwatch_region: "us-east-1"

# Error Processing
enable_deduplication: true
deduplication_window_seconds: 300
enable_stack_trace_enrichment: true
max_stack_trace_depth: 50

# Rate Limiting
enable_rate_limiting: true
max_errors_per_minute: 100

# Monitoring
enable_error_metrics: true
enable_real_time_alerts: false
