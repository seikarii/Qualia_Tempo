# Boss AI Configuration
# Defines behavior rules for the boss AI system
# Boss = Song: Boss health tied to song duration, phases tied to song progress

# ============================================================================
# BOSS PHASES (Health/Time-Based Progression)
# ============================================================================
phases:
  phase_1_opening:
    health_range: [75, 100]  # 100-75% health
    song_progress_range: [0.0, 0.25]  # 0-25% of song
    name: "Opening - Calm Before Storm"
    aggression_multiplier: 0.7  # Less aggressive in opening
    telegraph_multiplier: 1.5  # Longer telegraph times
    pattern_frequency_multiplier: 0.8  # Fewer attacks
    allowed_pattern_types: ["projectile", "movement"]
    phase_transition_threshold: 75  # Health % to transition to next phase
    
  phase_2_escalation:
    health_range: [50, 75]  # 75-50% health
    song_progress_range: [0.25, 0.5]  # 25-50% of song
    name: "Escalation - Rising Tension"
    aggression_multiplier: 1.0  # Normal aggression
    telegraph_multiplier: 1.0  # Normal telegraph
    pattern_frequency_multiplier: 1.0  # Normal frequency
    allowed_pattern_types: ["projectile", "melee", "aoe", "movement"]
    phase_transition_threshold: 50
    
  phase_3_climax:
    health_range: [25, 50]  # 50-25% health
    song_progress_range: [0.5, 0.75]  # 50-75% of song
    name: "Climax - Peak Intensity"
    aggression_multiplier: 1.3  # More aggressive
    telegraph_multiplier: 0.7  # Shorter telegraph
    pattern_frequency_multiplier: 1.3  # More attacks
    allowed_pattern_types: ["projectile", "melee", "aoe", "movement", "special"]
    phase_transition_threshold: 25
    
  phase_4_finale:
    health_range: [0, 25]  # 25-0% health
    song_progress_range: [0.75, 1.0]  # 75-100% of song
    name: "Finale - Desperate Fury"
    aggression_multiplier: 1.5  # Maximum aggression
    telegraph_multiplier: 0.5  # Minimal telegraph
    pattern_frequency_multiplier: 1.5  # Rapid attacks
    allowed_pattern_types: ["projectile", "melee", "aoe", "special"]
    phase_transition_threshold: 0  # Final phase

# ============================================================================
# AGGRESSION SYSTEM (Volume + Tempo + Harmony-Based)
# ============================================================================
aggression:
  # Base aggression from song volume (difficulty)
  volume_influence:
    training: 0.3  # Volume 0-40% → Low aggression
    normal: 0.6    # Volume 40-60% → Medium aggression
    hard: 0.8      # Volume 60-80% → High aggression
    extreme: 1.0   # Volume 80-100% → Maximum aggression
    
  # Tempo influence on aggression
  tempo_modifiers:
    slow: 0.8      # BPM < 100 → Calmer
    normal: 1.0    # BPM 100-140 → Standard
    fast: 1.2      # BPM 140-180 → More aggressive
    extreme: 1.4   # BPM > 180 → Frenetic
    
  # Player harmony influence (from HarmonyAnalysisService)
  harmony_modifiers:
    perfect_harmony: 0.7   # Player harmony ≥ 0.90 → Boss less aggressive
    harmonic: 0.85         # Player harmony ≥ 0.60 → Slightly less aggressive
    neutral: 1.0           # Player harmony 0.40-0.60 → Normal
    chaotic: 1.15          # Player harmony ≤ 0.40 → More aggressive
    extreme_chaos: 1.3     # Player harmony ≤ 0.20 → Much more aggressive
    
  # Player combo influence
  combo_modifiers:
    low_combo: 0.9        # Combo < 10 → Slightly less aggressive
    medium_combo: 1.0     # Combo 10-30 → Normal
    high_combo: 1.1       # Combo 30-50 → More aggressive
    ultimate_combo: 1.2   # Combo ≥ 50 → Maximum response
    
  # Thresholds for aggression classification
  thresholds:
    passive: 0.3      # Very low aggression
    cautious: 0.5     # Low aggression
    normal: 0.7       # Standard aggression
    aggressive: 0.85  # High aggression
    enraged: 1.0      # Maximum aggression

# ============================================================================
# PATTERN SELECTION SYSTEM (Context-Aware Attack Choices)
# ============================================================================
pattern_selection:
  # Pattern selection weights based on current context
  context_weights:
    player_distance:
      close: ["melee", "aoe"]  # < 30% of arena → melee/aoe preferred
      medium: ["projectile", "aoe"]  # 30-70% → projectile/aoe
      far: ["projectile", "special"]  # > 70% → projectile/special
      
    player_harmony:
      harmonic: ["movement", "projectile"]  # Harmonic player → simpler patterns
      neutral: ["projectile", "melee", "aoe"]  # Neutral → varied patterns
      chaotic: ["special", "aoe"]  # Chaotic player → complex patterns
      
    boss_health:
      healthy: ["projectile", "movement"]  # > 75% → basic patterns
      wounded: ["melee", "aoe", "special"]  # 25-75% → mixed patterns
      critical: ["special", "aoe"]  # < 25% → desperate patterns
      
  # Cooldown management
  cooldowns:
    min_time_between_patterns: 2.0  # Minimum seconds between attacks
    cooldown_reduction_per_phase: 0.15  # 15% reduction per phase
    cooldown_reduction_from_combo: 0.05  # 5% reduction per 10 combo
    max_cooldown_reduction: 0.5  # Maximum 50% cooldown reduction
    
  # Pattern frequency (attacks per minute)
  frequency:
    base_attacks_per_minute: 12  # Base rate
    phase_multiplier_active: true  # Apply phase frequency multiplier
    combo_scaling: 0.5  # +0.5 APM per 10 combo
    max_attacks_per_minute: 30  # Cap at 30 APM
    
  # Telegraph timing (warning before attack)
  telegraph:
    base_duration: 1.5  # Base telegraph time in seconds
    min_duration: 0.3   # Minimum telegraph (extreme difficulty)
    phase_multiplier_active: true  # Apply phase telegraph multiplier
    harmony_bonus: 0.3  # +0.3s for harmonic players (reward)
    chaos_penalty: -0.2  # -0.2s for chaotic players (punishment)

# ============================================================================
# ATTACK PATTERNS (Default Pattern Library)
# ============================================================================
default_patterns:
  # Basic Projectile Patterns
  single_projectile:
    type: "projectile"
    weight: 10
    damage: 10
    telegraph_time: 1.5
    cooldown: 3.0
    phase_requirement: 1
    aggression_requirement: 0.0
    
  triple_spread:
    type: "projectile"
    weight: 8
    damage: 8
    telegraph_time: 1.2
    cooldown: 4.0
    phase_requirement: 2
    aggression_requirement: 0.4
    
  homing_missiles:
    type: "projectile"
    weight: 6
    damage: 12
    telegraph_time: 1.8
    cooldown: 5.0
    phase_requirement: 2
    aggression_requirement: 0.5
    
  # Melee Patterns
  dash_strike:
    type: "melee"
    weight: 7
    damage: 15
    telegraph_time: 1.0
    cooldown: 4.5
    phase_requirement: 2
    aggression_requirement: 0.6
    
  spin_attack:
    type: "melee"
    weight: 5
    damage: 20
    telegraph_time: 1.5
    cooldown: 6.0
    phase_requirement: 3
    aggression_requirement: 0.7
    
  # AoE Patterns
  shockwave:
    type: "aoe"
    weight: 8
    damage: 12
    telegraph_time: 2.0
    cooldown: 5.0
    phase_requirement: 2
    aggression_requirement: 0.5
    radius: 50.0
    
  poison_field:
    type: "aoe"
    weight: 6
    damage: 5  # DoT
    telegraph_time: 1.5
    cooldown: 7.0
    phase_requirement: 3
    aggression_requirement: 0.6
    radius: 80.0
    duration: 5.0
    
  # Special Patterns
  ultimate_barrage:
    type: "special"
    weight: 3
    damage: 30
    telegraph_time: 2.5
    cooldown: 15.0
    phase_requirement: 3
    aggression_requirement: 0.8
    
  chaos_vortex:
    type: "special"
    weight: 4
    damage: 25
    telegraph_time: 2.0
    cooldown: 12.0
    phase_requirement: 4
    aggression_requirement: 0.9

# ============================================================================
# BOSS BEHAVIOR MODIFIERS
# ============================================================================
behavior:
  # Vulnerability system
  vulnerability:
    enabled: true
    duration_after_pattern: 1.5  # Seconds of vulnerability after attack
    damage_multiplier: 1.5  # 1.5x damage when vulnerable
    harmonic_combo_neutralizes: true  # Harmonic combos can cancel attacks
    
  # Enrage system
  enrage:
    enabled: true
    trigger_time_remaining: 30.0  # Enrage if < 30s left in song
    aggression_boost: 0.3  # +30% aggression when enraged
    telegraph_reduction: 0.5  # 50% shorter telegraphs
    pattern_frequency_boost: 1.5  # 1.5x attack frequency
    
  # Movement behavior
  movement:
    enabled: true
    base_speed: 100.0  # Pixels per second
    aggression_speed_multiplier: 1.2  # +20% speed per aggression tier
    min_distance_from_player: 100.0  # Minimum safe distance
    max_distance_from_player: 300.0  # Maximum pursuit distance
    repositioning_frequency: 5.0  # Reposition every 5 seconds
    
  # Defensive behavior
  defense:
    retreat_on_low_health: true
    retreat_health_threshold: 15  # Retreat at < 15% health
    retreat_duration: 3.0  # 3 seconds of retreat
    invulnerable_during_retreat: true

# ============================================================================
# QUALIA GENERATION (Boss Attacks Generate Qualia)
# ============================================================================
qualia_generation:
  enabled: true
  generation_per_attack: 5  # Base Qualia generated per attack
  generation_multiplier_by_phase:
    1: 0.8  # Phase 1: Less Qualia
    2: 1.0  # Phase 2: Normal
    3: 1.2  # Phase 3: More Qualia
    4: 1.5  # Phase 4: Maximum Qualia
  color_distribution:
    purple: 0.6  # 60% purple (hostile)
    black: 0.3   # 30% black (hostile)
    red: 0.1     # 10% red (chaos)

# ============================================================================
# FEATURE FLAGS
# ============================================================================
features:
  enable_phase_transitions: true
  enable_aggression_system: true
  enable_harmony_influence: true
  enable_combo_influence: true
  enable_vulnerability_windows: true
  enable_enrage_mechanic: true
  enable_adaptive_difficulty: true
  enable_qualia_generation: true
  log_ai_decisions: true  # Log pattern selection decisions
  emit_debug_events: false  # Emit detailed debug events
